/* ---------- state + storage ----------
   Saved form (encrypted at rest): {v:2, vault:{p:{salt,w}, r:{salt,w}}, data:{iv,ct}}
   A random data key encrypts everything; it is wrapped twice: once by the PIN, once by the recovery code. */
let S={accounts:[]};
let ST=null,LEG=null;
let ready=false,dek=null,dekRaw=null,mode='loading',col=null,wq=Promise.resolve(),sq=Promise.resolve(),hiddenAt=0;
const ui={kind:'all',q:'',confirm:null,revealed:{},lock:'pin',showCode:null,fromSettings:false};
const DOC2='vault-v2';
function persist(){
  if(!ST)return;
  if(mode==='cloud'){const body=clone(ST);const ref=col.doc(DOC2);
    wq=wq.then(()=>ref.set(body)).catch(e=>{if(e&&e.code==='unavailable')return new Promise(r=>setTimeout(r,800)).then(()=>ref.set(body));throw e})
      .catch(()=>toast('ما انحفظ، جرّب مرة تانية'))}
  else{try{localStorage.setItem('phx-vault-v2',JSON.stringify(ST))}catch(e){toast('ما قدرنا نحفظ على هالجهاز')}}
}
function save(){if(!dek||!ST)return;const snap=JSON.stringify({accounts:S.accounts});sq=sq.then(async()=>{ST.data=await encWith(dek,snap);persist()}).catch(()=>toast('ما انحفظ'))}
function dropLegacy(){LEG=null;if(mode==='cloud'){col.doc(DOC).delete().catch(()=>{})}else{try{localStorage.removeItem('phx-vault-v1')}catch(e){}}}
async function init(){
  let db=null,user=null,id=null;
  try{if(window.claude&&typeof claude.use==='function'){[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}}catch(e){}
  try{id=user?await user.id():null}catch(e){}
  if(db&&id){mode='cloud';col=db.collection('data/users/'+id);
    try{const l=await col.doc(DOC).get();if(l.exists)LEG=clone(l.data())}catch(e){}
    col.doc(DOC2).onSnapshot(snap=>{ST=snap.exists?clone(snap.data()):null;ready=true;onStored()},()=>toast('انقطع الاتصال، سكّر الصفحة وافتحها من جديد'));
  }else{mode='local';
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    try{ST=JSON.parse(localStorage.getItem('phx-vault-v2')||'null')}catch(e){}
    try{LEG=JSON.parse(localStorage.getItem('phx-vault-v1')||'null')}catch(e){}
    ready=true;onStored()}
}

  applyBg();

/* ---------- encryption ---------- */
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
async function pbk(secret,salt){const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encBytes(k,bytes){const iv=rand(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,bytes);return {iv:b64(iv),ct:b64(ct)}}
const encWith=(k,str)=>encBytes(k,te.encode(str));
async function decRaw(k,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},k,ub64(o.ct)))}
async function decWith(k,o){return td.decode(await decRaw(k,o))}
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function newCode(){let c='';rand(16).forEach(x=>{c+=ALPH[x%ALPH.length]});return c.match(/.{4}/g).join('-')}
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function wrap(secret){const salt=rand(16);const k=await pbk(secret,salt);return {salt:b64(salt),w:await encBytes(k,dekRaw)}}
async function setDek(raw){dekRaw=raw;dek=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
async function openWith(secret,slot){
  try{const k=await pbk(secret,ub64(slot.salt));const raw=await decRaw(k,slot.w);await setDek(raw);
    let o={accounts:[]};if(ST.data)o=JSON.parse(await decWith(dek,ST.data));S={accounts:Array.isArray(o.accounts)?o.accounts:[]};return true}
  catch(e){dek=null;dekRaw=null;return false}
}
async function createVault(pin,accounts){
  await setDek(rand(32));const code=newCode();
  ST={v:2,vault:{p:await wrap(pin),r:await wrap(normCode(code))},data:null};S={accounts:accounts||[]};
  ST.data=await encWith(dek,JSON.stringify({accounts:S.accounts}));persist();return code;
}
async function changePin(pin){ST.vault.p=await wrap(pin);persist()}
async function newRecovery(){const c=newCode();ST.vault.r=await wrap(normCode(c));persist();return c}
function lock(){dek=null;dekRaw=null;S={accounts:[]};ui.revealed={};ui.lock='pin';ui.fromSettings=false;closeSheet();gate();render()}

  let sample=null;try{sample=await claude.use('sample')}catch(e){}
  if(!sample){toast('قراية الصور مش متاحة هون');return}
  const lim=await sample.limits().catch(()=>null);
  if(!lim||!lim.images){toast('قراية الصور مش متاحة هون');return}
  if(btn){btn.setAttribute('aria-busy','true');btn.querySelector('b').textContent='عم يقرا الصورة…'}
  try{
    const r=await sample.json(SHOT_PROMPT,{images:[file],cache:false,modelTier:'default'});
    fillForm(r||{});toast('تعبّت الخانات، راجعها قبل ما تحفظ');
  }catch(e){
    const c=e&&e.code;toast(c==='not_granted'?'لازم تسمح للصفحة تبعت الصورة لـ Claude':c==='rate_limited'?'استنى شوي وجرّب مرة تانية':c==='image_rejected'?'الصورة كبيرة أو نوعها مش مقبول':'ما قدر يقرا الصورة، جرّب صورة أوضح');
  }finally{if(btn){btn.removeAttribute('aria-busy');btn.querySelector('b').textContent='عبّي من سكرين شوت'}}
}
function fillForm(r){
  const f=$('#fAcc');if(!f)return;const str=k=>typeof r[k]==='string'?r[k].trim():'';
  const kind=['trading','wallet','other'].includes(r.kind)?r.kind:f.dataset.kind;
  const kb=f.querySelector('[data-act="fkind"][data-v="'+kind+'"]');if(kb)kb.click();
  let co=str('company');if(co){const hit=CAT[kind].find(x=>norm(x)===norm(co)||norm(x).startsWith(norm(co)));if(hit)co=hit}
  const set=(id,v)=>{const e=$('#'+id);if(e&&v)e.value=v};
  set('company',co);set('server',str('server'));set('login',str('login'));set('owner',str('owner'));set('address',str('address'));
  const cur=str('currency').toUpperCase();if(CURS.includes(cur)){set('currency',cur);set('currency2',cur)}
  if(NETS.includes(str('network')))set('network',str('network'));
  const pick=(g,v)=>{const b=f.querySelector('#'+g+' [data-v="'+v+'"]');if(b)b.click()};
  if(PLATS.includes(str('platform')))pick('platPicks',str('platform'));
  if(ATYPES.includes(str('acctType')))pick('typePicks',str('acctType'));
  set('tLev',str('leverage'));set('tSpread',str('spread'));set('tComm',str('commission'));
  if(str('ibCode')){const c=$('#ibOn');if(c&&!c.checked)c.click();set('ibCode',str('ibCode'))}
  if(str('note')){const n=$('#note');n.value=(n.value?n.value+'\n':'')+str('note')}
  if(str('password')){const p=$('#pw');p.value=str('password');p.type='text'}
  renderCo();renderSrv();
}

/* ---------- settings ---------- */
function settings(){
  let h=head('الإعدادات');
  h+='<section class="sec"><h2>الرمز والاسترجاع</h2><div class="dl" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">'+
    '<div class="acts"><button type="button" class="btn ghost" data-act="chgPin">غيّر الرمز</button><button type="button" class="btn ghost" data-act="newRec">كود استرجاع جديد</button></div>'+
    '<button type="button" class="btn ghost" data-act="lockNow">قفّل الخزنة هلّق</button>'+
    '<div class="note">كل شي بالخزنة بيتشفّر على تلفونك قبل ما ينحفظ، وما حدا بيقدر يقراه من دون الرمز أو كود الاسترجاع، ولا حتى أنا. إذا ضيّعت التنين، الحسابات بتروح. الخزنة بتقفل لحالها إذا طلعت منها أكتر من دقيقة.</div></div></section>';
  h+='<section class="sec"><h2>الخلفية</h2><div class="dl" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">'+bgPrevHtml()+
    '<div class="acts"><button type="button" class="btn ghost" data-act="bgPick">اختار صورة</button>'+((ST&&(ST.bg||ST.bgOff))?'<button type="button" class="btn ghost" data-act="bgReset">رجّع الوردة</button>':'')+(ST&&ST.bgOff?'':'<button type="button" class="btn ghost" data-act="bgClear">بلا خلفية</button>')+'</div>'+
    '<div class="note">اختار أي صورة من الألبوم، متل صورة مصاري حقيقية. بتبيّن ورا الخزنة وعلى شاشة القفل.</div></div></section>';
  h+='<section class="sec"><h2>نسخة احتياطية</h2><div class="dl" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px"><div class="acts"><button type="button" class="btn ghost" data-act="export">نزّل نسخة</button><button type="button" class="btn ghost" data-act="copyExport">انسخ النسخة</button></div>';
  h+='<label class="f">رجّع نسخة (الصق النص هون)<textarea id="impTxt" class="ltr" placeholder="{ ... }"></textarea></label><button type="button" class="btn ghost" data-act="import">رجّع النسخة</button>';
  h+='<div class="note">النسخة مشفّرة كلها، وبتنفتح بالرمز أو كود الاسترجاع تبعها.</div></div></section>';
  h+='<section class="sec"><h2>على الآيفون</h2><div class="note">افتح الصفحة بـ Safari، اكبس زر المشاركة، وبعدين «Add to Home Screen». '+(mode==='cloud'?'الخزنة محفوظة على حسابك بـ Claude، وما حدا غيرك بيوصلّها.':HAS_CLAUDE?'الخزنة هلّق محفوظة على هالجهاز بس.':'هيدا الأبليكيشن بيحفظ الخزنة على هالتلفون بس. اعمل نسخة احتياطية كل فترة، وفيك ترجّعها بنسخة Claude أو العكس.')+'</div></section>';
  openSheet(h);
}
const backup=()=>JSON.stringify({app:'phx-vault',v:2,stored:ST});
async function exportFile(){const fn='khazna-'+new Date().toISOString().slice(0,10)+'.json';
  if(HAS_CLAUDE){try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:fn,data:backup()});return}}catch(e){if(e&&e.code&&e.code!=='unavailable')return}}
  else{try{const f=new File([backup()],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});return}
    const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return}catch(e){if(e&&e.name==='AbortError')return}}
  copyExport()}
function copyExport(){const j=backup();const fb=()=>{const t=$('#impTxt');if(t){t.value=j;t.select();toast('النص بالخانة، انسخو يدوي')}};try{navigator.clipboard.writeText(j).then(()=>toast('انسخت، الصقها بالـ Notes'),fb)}catch(e){fb()}}
function doImport(btn){
  let o;try{o=JSON.parse($('#impTxt').value)}catch(e){toast('النص مش نسخة صحيحة');return}
  if(!o||o.app!=='phx-vault'||o.v!==2||!o.stored||!o.stored.vault){toast('هيدي مش نسخة من الخزنة');return}
  if(ui.confirm!=='import'){ui.confirm='import';btn.textContent='متأكد؟ رح تتبدّل الخزنة كلها، اكبس كمان مرة';btn.className='btn danger';return}
  ST=o.stored;persist();lock();toast('رجعت النسخة، افتحها برمزها');
}

/* ---------- background photo ---------- */
function shrink(file,maxSide,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const r=Math.min(1,maxSide/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
async function setBg(file){
  try{let d=await shrink(file,1100,.62);if(d.length>170000)d=await shrink(file,850,.5);if(d.length>170000){toast('الصورة كبيرة كتير، جرّب وحدة تانية');return}
    ST.bg=d;delete ST.bgOff;persist();applyBg();settings();toast('انحطّت الخلفية')}catch(e){toast('ما قدرنا نفتح الصورة')}
}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;const f=b.closest('form');
  const dlId=()=>b.closest('.dl').dataset.id;
  switch(act){
    case 'kind':ui.kind=b.dataset.k;render();break;
    case 'new':form(null);break;
    case 'open':detail(b.dataset.id);break;
    case 'edit':form(b.dataset.id);break;
    case 'close':closeSheet();break;
    case 'settings':settings();break;
    case 'lockTap':case 'lockNow':lock();break;
    case 'chgPin':closeSheet();ui.lock='newpin';ui.fromSettings=true;gate();break;
    case 'newRec':{closeSheet();const c=await newRecovery();ui.showCode=c;gate();break}
    case 'lkForgot':ui.lock='recover';gate();break;
    case 'lkBack':ui.lock='pin';gate();break;
    case 'lkCancel':ui.lock='pin';ui.fromSettings=false;gate();break;
    case 'lkCopy':try{await navigator.clipboard.writeText(ui.showCode);toast('انسخ الكود')}catch(e){toast('علّم الكود وانسخو')}break;
    case 'lkDone':if(!$('#lkSaved').checked)return;ui.showCode=null;gate();render();break;
    case 'fkind':f.dataset.kind=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderCo();break;
    case 'co':$('#company').value=b.dataset.v;renderCo();renderSrv();break;
    case 'coLb':$('#company').value='لبنان';renderCo();$('#company').select();break;
    case 'copyIb':{const a=A(dlId());try{await navigator.clipboard.writeText((a.ib||{})[b.dataset.f]||'');toast('انسخ')}catch(e){toast('ما زبط النسخ')}break}
    case 'botname':$('#botName').value=b.dataset.v;break;
    case 'copyBot':{const a=A(dlId());try{await navigator.clipboard.writeText(a.bot.host||'');toast('انسخ')}catch(e){toast('ما زبط النسخ')}break}
    case 'plat':case 'atype':case 'pk':b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'srv':$('#server').value=b.dataset.v;renderSrv();break;
    case 'owner':$('#owner').value=b.dataset.v;break;
    case 'pwToggle':{const p=$('#pw');p.type=p.type==='password'?'text':'password';break}
    case 'del':if(ui.confirm!=='del'){ui.confirm='del';b.textContent='متأكد؟ اكبس كمان مرة';return}
      S.accounts=S.accounts.filter(x=>x.id!==f.dataset.id);save();closeSheet();render();toast('انحذف');break;
    case 'reveal':{const id=dlId();ui.revealed[id]=true;detail(id);break}
    case 'hide':{const id=dlId();delete ui.revealed[id];detail(id);break}
    case 'copy':{const id=dlId(),a=A(id);const val=a[b.dataset.f];
      try{await navigator.clipboard.writeText(val||'');toast('انسخ')}catch(e){toast('ما زبط النسخ، علّم النص وانسخو')}break}
    case 'shot':{const i=$('#shotFile');i.value='';i.click();break}
    case 'bgPick':{const i=$('#bgFile');i.value='';i.click();break}
    case 'bgClear':delete ST.bg;ST.bgOff=true;persist();applyBg();settings();break;
    case 'bgReset':delete ST.bg;delete ST.bgOff;persist();applyBg();settings();break;
    case 'export':exportFile();break;
    case 'copyExport':copyExport();break;
    case 'import':doImport(b);break;
  }
});
document.addEventListener('input',ev=>{
  const id=ev.target.id;
  if(id==='q'){ui.q=ev.target.value;render()}
  else if(id==='company'){renderCo();renderSrv()}
});
document.addEventListener('change',ev=>{if(ev.target.id==='lkSaved'){$('#lkDoneBtn').disabled=!ev.target.checked}if(ev.target.id==='botOn'){ev.target.closest('form').dataset.bot=ev.target.checked?'on':'off'}if(ev.target.id==='ibOn'){ev.target.closest('form').dataset.ib=ev.target.checked?'on':'off'}if(ev.target.id==='bgFile'&&ev.target.files&&ev.target.files[0])setBg(ev.target.files[0]);if(ev.target.id==='shotFile'&&ev.target.files&&ev.target.files[0])fromShot(ev.target.files[0])});
document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='fAcc')submit(ev.target);else if(ev.target.id==='lkForm')lockSubmit(ev.target)});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet();
});
init();
})();
</script>
