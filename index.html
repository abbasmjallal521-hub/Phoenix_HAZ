<title>Phoenix HAZ Syndicate</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Tajawal:wght@400;500;800&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: single centered column, ember-lit night sky, phoenix crest on top, stacked link plates */
:root{
  --night:#0d0907; --ash:#1a1210; --ember:#ff7a1a; --gold:#f2c14e; --flame:#d9381e;
  --text:#f6ece0; --muted:#bfa892; --line:rgba(242,193,78,.22);
  --f-display:"Cinzel", "Times New Roman", serif;
  --f-ar:"Tajawal", "Geeza Pro", "Segoe UI", sans-serif;
  --f-en:"Manrope", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--text);font-family:var(--f-ar);min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(120% 60% at 50% 0%,rgba(255,122,26,.22),transparent 60%),radial-gradient(80% 40% at 50% 100%,rgba(217,56,30,.18),transparent 70%);
  background-attachment:fixed}
html[lang="en"] body{font-family:var(--f-en)}
#embers{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding-block:28px 40px;display:flex;flex-direction:column;align-items:center;gap:22px}
.lang{align-self:flex-end;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:transparent;color:var(--muted);border:0;padding:7px 14px;font:600 13px var(--f-en);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--night)}
.lang button:focus-visible,.link:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.crest{width:min(380px,96vw);height:auto;animation:rise 4s ease-in-out infinite}
@keyframes rise{50%{transform:translateY(-6px)}}
.brand{text-align:center;display:flex;flex-direction:column;gap:6px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,7vw,32px);letter-spacing:.06em;margin:0;line-height:1.1;
  background:linear-gradient(180deg,var(--gold),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.brand .sub{font-family:var(--f-display);font-size:12px;letter-spacing:.38em;color:var(--muted);text-transform:uppercase}
.tag{font-size:15px;color:var(--muted);text-align:center;max-width:34ch;line-height:1.6;margin:0}
.markets{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.markets span{font:600 11px var(--f-en);letter-spacing:.08em;color:var(--gold);border:1px solid var(--line);padding:4px 9px;border-radius:4px}
.links{width:100%;display:flex;flex-direction:column;gap:12px}
.link{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;text-decoration:none;color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line);transition:transform .15s,border-color .15s,background .15s}
.link:hover{transform:translateY(-2px);border-color:var(--gold);background:rgba(242,193,78,.08)}
.link.main{background:linear-gradient(135deg,var(--flame),var(--ember) 60%,var(--gold));border:0;color:#1b0d05}
.link.main .t small{color:rgba(27,13,5,.75)}
.ico{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;background:rgba(0,0,0,.28)}
.link.main .ico{background:rgba(255,255,255,.22)}
.ico svg{width:22px;height:22px;fill:currentColor}
.t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.t b{font-size:16px;font-weight:800}
.t small{font-size:13px;color:var(--muted)}
.arrow{opacity:.7;font:700 18px var(--f-en)}
html[dir="rtl"] .arrow{transform:scaleX(-1)}
.link.soon{opacity:.55;pointer-events:none}
.link.soon .arrow{font-size:11px;letter-spacing:.08em;opacity:1;transform:none}
.social{display:flex;gap:14px}
.social a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--gold);transition:background .15s}
.social a:hover{background:rgba(242,193,78,.12)}
.social svg{width:20px;height:20px;fill:currentColor}
.disc{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7;max-width:46ch;opacity:.8;margin:0}
.sign{font-family:var(--f-display);font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.crest{animation:none}#embers{display:none}}
</style>

<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

function render(){
  const h = document.documentElement;
  h.lang = lang; h.dir = lang==="ar" ? "rtl" : "ltr";
  document.getElementById("btn-ar").setAttribute("aria-pressed", lang==="ar");
  document.getElementById("btn-en").setAttribute("aria-pressed", lang==="en");
  document.querySelectorAll("[data-ar]").forEach(el=>{ el.innerHTML = el.dataset[lang]; });
  const soon = lang==="ar" ? "قريباً" : "SOON";
  document.getElementById("links").innerHTML = LINKS.map(l=>{
    const [title,sub] = l[lang];
    return `<a class="link${l.main?" main":""}${l.url?"":" soon"}" href="${l.url||"#"}" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24">${ICONS[l.icon]}</svg></span>
      <span class="t"><b>${title}</b><small>${sub}</small></span>
      <span class="arrow">${l.url?"→":soon}</span></a>`;
  }).join("");
  document.getElementById("social").innerHTML = SOCIAL.filter(s=>s.url).map(s=>
    `<a href="${s.url}" target="_blank" rel="noopener" aria-label="${s.label}"><svg viewBox="0 0 24 24">${ICONS[s.icon]}</svg></a>`).join("");
}
function setLang(l){ lang=l; try{localStorage.setItem("phx-lang",l);}catch(e){} render(); }
document.getElementById("btn-ar").onclick=()=>setLang("ar");
document.getElementById("btn-en").onclick=()=>setLang("en");

/* rising embers */
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("embers"), x=c.getContext("2d"); let W,H,P=[];
  function size(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  size(); addEventListener("resize",size);
  for(let i=0;i<45;i++) P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.6+.2,a:Math.random()});
  (function tick(){
    x.clearRect(0,0,W,H);
    for(const p of P){
      p.y-=p.v; p.x+=Math.sin(p.y/40)*.3; p.a-=.002;
      if(p.y<-10||p.a<=0){ p.y=H+10; p.x=Math.random()*W; p.a=1; }
      x.fillStyle=`rgba(255,${120+Math.floor(p.r*40)},40,${p.a*.7})`;
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.28); x.fill();
    }
    requestAnimationFrame(tick);
  })();
})();
